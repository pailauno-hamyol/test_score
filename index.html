    <!-- Custom Modal for Notifications / Winner Announcement -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div id="modal-content" class="bg-white border-2 border-amber-400 rounded-3xl p-8 max-w-md w-full mx-4 text-center transform scale-95 transition-transform duration-300 shadow-2xl">

            <button onclick="closeModal()" class="w-full py-3 bg-amber-400 hover:bg-amber-500 text-slate-900 font-black rounded-xl transition shadow">

    <!-- JavaScript Logic -->
    <script>
        // State variables for individual classes
        const scores = {
            'g1-c1': 0,
            'g1-c2': 0,
            'g2-c1': 0,
            'g2-c2': 0,
            'g3-c1': 0,
            'g3-c2': 0
        };

        // Bonus points awarded directly to team totals
        let team1Bonus = 0;
        let team2Bonus = 0;

        // Timer variables
        let timerSeconds = 180; // Default 3 minutes
        let timerInterval = null;
        let isTimerRunning = false;

        // Sound Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 440, type = 'sine', duration = 0.1) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function playWinFanfare() {
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, idx) => {
                setTimeout(() => playBeep(freq, 'triangle', 0.3), idx * 150);
            });
        }

        // Score Update Logic
        function changeScore(classKey, delta) {
            scores[classKey] = Math.max(0, scores[classKey] + delta);
            
            // Play effect sound
            if (delta > 0) playBeep(523.25, 'sine', 0.15);
            else playBeep(220, 'square', 0.15);

            updateUI();
        }

        function addTeamBonus(teamNum, points) {
            if (teamNum === 1) team1Bonus += points;
            else team2Bonus += points;

            playBeep(659.25, 'sine', 0.2);
            updateUI();
        }

        function updateUI() {
            // Update individual class score DOM
            for (const key in scores) {
                const el = document.getElementById(`score-${key}`);
                if (el) el.textContent = scores[key];
            }

            // Calculate Team 1 Total (1반들: 1-1, 2-1, 3-1 + Bonus)
            const team1Total = scores['g1-c1'] + scores['g2-c1'] + scores['g3-c1'] + team1Bonus;
            
            // Calculate Team 2 Total (2반들: 1-2, 2-2, 3-2 + Bonus)
            const team2Total = scores['g1-c2'] + scores['g2-c2'] + scores['g3-c2'] + team2Bonus;

            // Update Total DOMs
            const t1El = document.getElementById('team1-total-score');
            const t2El = document.getElementById('team2-total-score');
            
            if (t1El) t1El.textContent = team1Total;
            if (t2El) t2El.textContent = team2Total;
        }

        // Reset All Scores
        function confirmResetAll() {
            showCustomModal(
                '<i class="fa-solid fa-triangle-exclamation text-rose-500"></i>',
                '점수 초기화',
                '모든 학년 및 연합팀의 점수를 초기화하시겠습니까?',
                true,
                () => {
                    for (const key in scores) scores[key] = 0;
                    team1Bonus = 0;
                    team2Bonus = 0;
                    updateUI();
                }
            );
        }

        // Timer Logic
        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-timer-start');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
                btn.className = "px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-sm transition";
            } else {
                isTimerRunning = true;
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                btn.className = "px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-sm transition";
                
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        document.getElementById('timer-display').textContent = formatTime(timerSeconds);
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
                        btn.className = "px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-sm transition";
                        playBeep(880, 'sawtooth', 0.5);
                        triggerConfetti();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            if (isTimerRunning) toggleTimer();
            timerSeconds = 180;
            document.getElementById('timer-display').textContent = formatTime(timerSeconds);
        }

        // Celebration Confetti
        function triggerConfetti() {
            playWinFanfare();
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        // Declare Winner Modal Logic
        function declareWinner() {
            const team1Total = scores['g1-c1'] + scores['g2-c1'] + scores['g3-c1'] + team1Bonus;
            const team2Total = scores['g1-c2'] + scores['g2-c2'] + scores['g3-c2'] + team2Bonus;

            let icon = '<i class="fa-solid fa-trophy text-amber-400"></i>';
            let title = '';
            let body = '';

            if (team1Total > team2Total) {
                title = '1반 연합팀 최종 승리! 🎉';
                body = `축하합니다! 1반 연합팀이 총 <strong>${team1Total}점</strong>으로 승리하였습니다! (2반 연합팀: ${team2Total}점)`;
            } else if (team2Total > team1Total) {
                title = '2반 연합팀 최종 승리! 🎉';
                body = `축하합니다! 2반 연합팀이 총 <strong>${team2Total}점</strong>으로 승리하였습니다! (1반 연합팀: ${team1Total}점)`;
            } else {
                title = '무승부! 🤝';
                body = `두 팀 모두 <strong>${team1Total}점</strong>으로 동점입니다! 멋진 경기였습니다!`;
            }

            showCustomModal(icon, title, body, false);
            triggerConfetti();
        }

        // Custom Modal Controller
        function showCustomModal(iconHtml, title, bodyHtml, isConfirm = false, onConfirm = null) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');

            document.getElementById('modal-icon').innerHTML = iconHtml;
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;

            // Modal Action Button Setup
            const actionBtn = content.querySelector('button');
            if (isConfirm) {
                actionBtn.textContent = '확인 및 초기화';
                actionBtn.onclick = () => {
                    if (onConfirm) onConfirm();
                    closeModal();
                };
            } else {
                actionBtn.textContent = '확인';
                actionBtn.onclick = closeModal;
            }

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');

            overlay.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        // Initialize display on load
        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
